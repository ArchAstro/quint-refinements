[package]
name = "quint-refinements"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Declarative refinement testing between Quint models and Rust implementations"
license = "MIT"
repository = "https://github.com/ArchAstro/quint-refinements"
documentation = "https://docs.rs/quint-refinements"
readme = "README.md"
keywords = ["quint", "refinement", "formal-methods", "testing"]
categories = ["development-tools::testing"]
include = [
    "/src/**",
    "/examples/*.rs",
    "/examples/two_phase_commit/coordinator.rs",
    "/examples/two_phase_commit/traces.json",
    "/tests/**",
    "/expression_vocabulary.json",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[[example]]
name = "two_phase_commit"
path = "examples/two_phase_commit.rs"

[[example]]
name = "two_phase_commit_async"
path = "examples/two_phase_commit_async.rs"
