name: Publish npm package

# A compiler-vX.Y.Z tag on main publishes the root npm package through npm's
# GitHub Actions trusted publisher. No long-lived NPM_TOKEN is used.

on:
  push:
    tags:
      - "compiler-v*"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify release and build package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a release commit from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in origin/main" >&2
            exit 1
          fi

      - name: Read release version from tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            compiler-v*)
              echo "version=${TAG#compiler-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported npm release tag: $TAG" >&2
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Verify package identity matches the tag
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          actual_name="$(node -p "require('./package.json').name")"
          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_name" != "quint-refinements" ]]; then
            echo "Unexpected npm package name: $actual_name" >&2
            exit 1
          fi
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Version mismatch: tag says $EXPECTED_VERSION, package.json says $actual_version" >&2
            exit 1
          fi

      - name: Test and build package
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm test
          mkdir dist
          npm pack --pack-destination dist

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish with npm trusted publishing
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish package or accept matching retry
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one package tarball, found ${#packages[@]}" >&2
            exit 1
          fi

          npm_version="$(npm --version)"
          if ! NPM_VERSION="$npm_version" node -e "const [major, minor, patch] = process.env.NPM_VERSION.split('.').map(Number); const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))); process.exit(supported ? 0 : 1)"; then
            echo "Trusted publishing requires npm 11.5.1 or newer; found $npm_version" >&2
            exit 1
          fi

          package="${packages[0]}"
          local_integrity="$(node -e "const fs=require('fs'),crypto=require('crypto'); process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$package")"
          spec="quint-refinements@$VERSION"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if registry_integrity="$(npm view "$spec" dist.integrity 2>"$error_file")"; then
            if [[ "$registry_integrity" != "$local_integrity" ]]; then
              echo "$spec already exists with different contents" >&2
              exit 1
            fi
            echo "$spec already exists with matching contents; skipping publish"
          elif grep -q 'E404' "$error_file"; then
            npm publish "$package"
          else
            cat "$error_file" >&2
            exit 1
          fi

  release:
    name: Create GitHub release
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release or accept matching retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; skipping creation"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "quint-refinements v$VERSION" \
            --notes "Published to npm: https://www.npmjs.com/package/quint-refinements/v/$VERSION" \
            --generate-notes
