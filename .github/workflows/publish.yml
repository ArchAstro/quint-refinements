name: Release

# A vX.Y.Z tag on main releases the Rust runtime to crates.io and the compiler
# to npm under that one version, then proves the published quick start works.
# Both registries authenticate this workflow through OIDC trusted publishing;
# no long-lived registry token is required. Every job is safe to re-run.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify release and build packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a release commit from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in origin/main" >&2
            exit 1
          fi

      - name: Read release version from tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Verify both packages match the tag
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          npm_name="$(node -p "require('./package.json').name")"
          npm_version="$(node -p "require('./package.json').version")"
          crate_version="$(cargo metadata --no-deps --format-version 1 --manifest-path bindings/rust/Cargo.toml \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).packages.find(p=>p.name==='quint-refinements').version))")"
          if [[ "$npm_name" != "quint-refinements" ]]; then
            echo "Unexpected npm package name: $npm_name" >&2
            exit 1
          fi
          for actual in "$npm_version" "$crate_version"; do
            if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
              echo "Version mismatch: tag says $EXPECTED_VERSION, npm says $npm_version, crate says $crate_version" >&2
              exit 1
            fi
          done

      - name: Test and build packages
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm test
          cargo test --locked --manifest-path bindings/rust/Cargo.toml --all-targets
          cargo package --locked --manifest-path bindings/rust/Cargo.toml
          mkdir dist
          npm pack --pack-destination dist

      - name: Upload verified npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  # The crate goes first: a project scaffolded by the compiler depends on it.
  publish-crate:
    name: Publish Rust runtime to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Only the first release of a new crate needs a token; see RELEASING.md.
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Check whether this version is already published
        id: existing
        run: |
          set -euo pipefail
          status="$(curl --silent --output index.txt --write-out '%{http_code}' \
            https://index.crates.io/qu/in/quint-refinements)"
          if [[ "$status" == "200" ]] && grep -q "\"vers\":\"$VERSION\"" index.txt; then
            echo "quint-refinements $VERSION is already on crates.io; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "200" || "$status" == "404" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "crates.io index returned HTTP $status" >&2
            exit 1
          fi

      - name: Authenticate with crates.io trusted publishing
        id: auth
        if: steps.existing.outputs.published == 'false' && env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: steps.existing.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --manifest-path bindings/rust/Cargo.toml

  publish-npm:
    name: Publish compiler to npm
    needs:
      - verify
      - publish-crate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish package or accept matching retry
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one package tarball, found ${#packages[@]}" >&2
            exit 1
          fi

          npm_version="$(npm --version)"
          if ! NPM_VERSION="$npm_version" node -e "const [major, minor, patch] = process.env.NPM_VERSION.split('.').map(Number); const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))); process.exit(supported ? 0 : 1)"; then
            echo "Trusted publishing requires npm 11.5.1 or newer; found $npm_version" >&2
            exit 1
          fi

          package="${packages[0]}"
          local_integrity="$(node -e "const fs=require('fs'),crypto=require('crypto'); process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$package")"
          spec="quint-refinements@$VERSION"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if registry_integrity="$(npm view "$spec" dist.integrity 2>"$error_file")"; then
            if [[ "$registry_integrity" != "$local_integrity" ]]; then
              echo "$spec already exists with different contents" >&2
              exit 1
            fi
            echo "$spec already exists with matching contents; skipping publish"
          elif grep -q 'E404' "$error_file"; then
            npm publish "$package"
          else
            cat "$error_file" >&2
            exit 1
          fi

  # What a new user types, against the real registries.
  quick-start:
    name: Run the published quick start
    needs:
      - verify
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Create and run a new project
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Registry mirrors can trail a publish by a few seconds.
          for attempt in 1 2 3 4 5 6; do
            rm -rf quick-start
            if npx --yes "quint-refinements@$VERSION" new quick-start \
              && cargo run --manifest-path quick-start/Cargo.toml | tee output.txt; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "The published quick start did not pass" >&2
              exit 1
            fi
            sleep 20
          done
          grep -q "counter.incrementRun refined 1 obligations" output.txt
          (cd quick-start && npx quint-refinements compile --check)

  release:
    name: Create GitHub release
    needs:
      - verify
      - quick-start
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release or accept matching retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; skipping creation"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "quint-refinements v$VERSION" \
            --notes "npm: https://www.npmjs.com/package/quint-refinements/v/$VERSION
          crates.io: https://crates.io/crates/quint-refinements/$VERSION" \
            --generate-notes
