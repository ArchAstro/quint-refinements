name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Check the standalone bank tutorial
        run: |
          cargo test --locked --manifest-path examples/rust/bank_account/Cargo.toml
          cargo run --locked --manifest-path examples/rust/bank_account/Cargo.toml
      - run: cargo test --locked --manifest-path bindings/rust/Cargo.toml --all-targets
      - name: Run documented examples
        run: |
          for example in ownership_records fixture_ownership structural_values failure_modes two_phase_commit two_phase_commit_async; do
            cargo run --locked --manifest-path bindings/rust/Cargo.toml --example "${example}"
          done

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path bindings/rust/Cargo.toml -- --check
      - run: cargo fmt --manifest-path examples/rust/bank_account/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path bindings/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path examples/rust/bank_account/Cargo.toml -- -D warnings
      - run: cargo doc --locked --manifest-path bindings/rust/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
      - run: cargo package --locked --manifest-path bindings/rust/Cargo.toml

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.85"
      - run: cargo test --locked --manifest-path bindings/rust/Cargo.toml --lib

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
