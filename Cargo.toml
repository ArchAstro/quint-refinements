[package]
name = "quint-refinements"
version = "0.1.0"
edition = "2024"
publish = false
description = "Declarative Quint-to-implementation refinement: ownership records, generated traces, and a plug-in primitive driver."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[[example]]
name = "two_phase_commit"
path = "examples/two_phase_commit.rs"
