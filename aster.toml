[targets.test]
command = "cargo test --locked"
depends_on = ["//self:check-generated-example"]

[targets.test-ci]
command = "cargo test --locked --all-targets"
depends_on = ["//self:check-generated-example"]

[targets.deps]
command = "npm ci"

[targets.check-generated-example]
command = "node examples/two_phase_commit/generate-traces.mjs --check"
depends_on = ["//self:deps"]

[targets.lint]
command = "cargo clippy --all-targets -- -D warnings"

[targets.build]
command = "cargo build --locked"
